name: 4bTech Space - update test (published -> new release)

# Before a production release: the release APK is built exactly as production builds it (not QA),
# then on real arm64 Android 11 (Redroid) the published version is installed, clones are made,
# and the new APK is installed over it (scripts/space-upgrade-test.sh). Results and screenshots
# go to the private repo's branch "results".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit of the private repo"
        required: true
        default: "feature/export-import-v2"
      version:
        description: "New version, e.g. 1.1.6"
        required: true
        default: "1.1.6"
      old:
        description: "Published version to update from"
        required: true
        default: "1.1.5"
  push:
    paths:
      - .github/workflows/multispace-upgrade-test.yml
      - scripts/space-upgrade-test.sh

permissions:
  contents: read

env:
  MS_REPO: 4BornGithub/4b-multi-space
  # A push runs it with these (there are no inputs then).
  REF: ${{ inputs.ref || 'feature/export-import-v2' }}
  NEW_VERSION: ${{ inputs.version || '1.1.6' }}
  OLD_VERSION: ${{ inputs.old || '1.1.5' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      token: ${{ steps.token.outputs.name }}
    steps:
      - name: Pick a token for the private repo
        id: token
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          MULTISPACE_REPO_TOKEN: ${{ secrets.MULTISPACE_REPO_TOKEN }}
        run: |
          for n in PRIVATE_REPO MULTISPACE_REPO_TOKEN; do
            v="${!n}"; [ -n "$v" ] || continue
            if git ls-remote "https://x-access-token:$v@github.com/$MS_REPO.git" HEAD >/dev/null 2>&1; then echo "name=$n" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::no token can read $MS_REPO"; exit 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MS_REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets[steps.token.outputs.name] }}
          path: private
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Release APK as production builds it, and the guest app
        working-directory: private
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066" >/dev/null
          V="$NEW_VERSION"; IFS=. read -r A B C <<< "$V"; CODE=$((A * 10000 + B * 100 + C))
          gradle --no-daemon --console=plain -PversionCode=$CODE -PversionName=$V :app:assembleRelease :testing:guest-app:assembleDebug >"$RUNNER_TEMP/build_log.txt" 2>&1 \
            || { grep -E "^e: |error:|What went wrong" -A3 "$RUNNER_TEMP/build_log.txt" | head -60; exit 1; }
          mkdir -p "$RUNNER_TEMP/x"
          cp app/build/outputs/apk/release/*universal*.apk "$RUNNER_TEMP/x/new.apk"
          cp testing/guest-app/build/outputs/apk/debug/guest-app-debug.apk "$RUNNER_TEMP/x/guest.apk"
          cp scripts/ci/save-results.sh "$RUNNER_TEMP/x/"
          echo "Built $V (code $CODE) from $REF ($(git rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-test-files
          path: ${{ runner.temp }}/x
          retention-days: 1

  update:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: localhost:6000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-test-files
          path: x
      - name: Published version
        run: curl -fsSL -o x/old.apk "https://github.com/Bhautik-4B/Action-Auto/releases/download/space-v$OLD_VERSION/4bTech-Space-$OLD_VERSION.apk" && ls -l x
      - name: Start Android 11 (Redroid, arm64)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q redroid/redroid:11.0.0-latest >/dev/null
          docker run -d --name android --privileged --memory=6g --cpus=4 -p 6000:5555 redroid/redroid:11.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 84); do adb connect localhost:6000 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::Android did not boot"; exit 1; }
      - name: Update test
        run: |
          RC=0; bash scripts/space-upgrade-test.sh x/old.apk x/new.apk x/guest.apk "$RUNNER_TEMP/out/upgrade-test" || RC=$?
          { echo "### Update $OLD_VERSION -> $NEW_VERSION"; echo '```'; cat "$RUNNER_TEMP/out/upgrade-test/notes.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Save results to the private repo (branch "results")
        if: always()
        env:
          TOKEN: ${{ secrets[needs.build.outputs.token] }}
          PRIVATE_REPO: ${{ env.MS_REPO }}
        run: bash x/save-results.sh "$RUNNER_TEMP/out" upgrade-test | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if the update test failed
        if: env.RC != '0'
        run: exit 1
