name: App explore - install Play Store apps and explore them

# Separate from the 4bTech Game workflow (android10-install.yml, scripts/): its own files (explore/),
# its own results (branch app-explore-results of the private repo Bhautik-4B/Game-Auto).
# For every app: its Play Store page (name, description), the app downloaded (APKPure, through
# apkeep), installed on a real arm64 Android 13 (Redroid), what Android says about it (version,
# permissions, screens), then explore/explore.sh taps through its screens and screenshots every
# new one. It never pays, deletes, logs out, calls, shares or types anything.
# Runs when this file or explore/ changes (with the default apps), or by hand (Run workflow).

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Play Store package names, separated by spaces
        default: "com.scanova.app com.mechodal.alakhjoli"
      minutes:
        description: Minutes of exploring per app
        default: "12"
      android:
        description: Android version of the test phone
        type: choice
        options: ["11", "10", "13"]
        default: "11"
      apkpure:
        description: Also download from APKPure/APKCombo (third-party; they have shipped modified apps)
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/app-explore.yml
      - explore/**

permissions:
  contents: read

env:
  PACKAGES: ${{ inputs.packages || 'com.scanova.app com.mechodal.alakhjoli' }}
  MINUTES: ${{ inputs.minutes || '12' }}
  ANDROID: ${{ inputs.android || '11' }}
  # The owner said yes to APKPure (3 Nov) for the parts the given APKs lack. Runs started by a
  # push use it; Run workflow asks (input apkpure).
  APKPURE: ${{ github.event_name == 'push' && 'true' || inputs.apkpure }}
  ANDROID_SERIAL: localhost:5555

jobs:
  explore:
    name: Explore apps on Android ${{ inputs.android || '11' }} (ARM)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb unzip tesseract-ocr "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb unzip tesseract-ocr >/dev/null
          # apkeep: the release's file for this CPU (names listed, so a wrong guess is visible)
          url=$(curl -fsSL https://api.github.com/repos/EFForg/apkeep/releases/latest | grep -oE '"browser_download_url": *"[^"]*"' | cut -d'"' -f4 | tee apkeep-assets.txt | grep -E 'aarch64-unknown-linux-gnu$' | head -1)
          echo "apkeep: ${url:-not found} (assets: $(tr '\n' ' ' < apkeep-assets.txt))"
          [ -n "$url" ] && curl -fsSL -o apkeep "$url" && chmod +x apkeep || echo "apkeep not available"
          sudo apt-get install -y -qq gh >/dev/null 2>&1 || true

      - name: Play Store pages
        run: |
          for p in $PACKAGES; do
            mkdir -p "out/$p"
            curl -fsSL -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
              "https://play.google.com/store/apps/details?id=$p&hl=en&gl=IN" -o "out/$p/play.html" || true
            python3 -I - "out/$p/play.html" > "out/$p/play.txt" <<'PY'
          import html, re, sys
          try:
              t = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          except OSError:
              print("Play Store page not available"); sys.exit()
          def meta(k):
              m = re.search(r'<meta (?:property|name)="%s" content="([^"]*)"' % k, t)
              return html.unescape(m.group(1)) if m else ""
          print("Name:", meta("og:title"))
          print("Short:", meta("description"))
          m = re.search(r'data-g-id="description"[^>]*>(.*?)</div>', t, re.S)
          if m:
              print("Description:"); print(re.sub(r"\s+\n", "\n", html.unescape(re.sub(r"<br\s*/?>", "\n", re.sub(r"<(?!br)[^>]+>", "", m.group(1))))).strip())
          for label in ["Updated on", "Downloads", "Released on", "Offered by", "Contains ads", "In-app purchases"]:
              m = re.search(re.escape(label) + r"</div><div[^>]*>([^<]+)", t)
              if m: print(label + ":", html.unescape(m.group(1)))
          PY
            rm -f "out/$p/play.html"
            head -3 "out/$p/play.txt"
          done

      # Sources tried in order, each one's answer logged: apkeep (APKPure's app API), APKPure's
      # download links, APKCombo. An APK can also be given in the private repo: release
      # "explore-apks" of Bhautik-4B/Game-Auto, files named <package>.apk / .xapk / .apks.
      - name: Download the apps
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          set +e   # a source that fails is logged, then the next one is tried
          mkdir -p apks
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          got() { [ "$(find "apks/$1" -type f -size +100k 2>/dev/null | wc -l)" -gt 0 ]; }
          # Complete apps the owner shared on Google Drive: their file ids are in drive.txt of the
          # private branch explore-apks (not in this public repo). Each file is named after the app
          # it holds (read from inside it): given/<package>.apks.
          git clone -q --depth 1 --branch explore-apks "https://x-access-token:$GH_TOKEN@github.com/Bhautik-4B/Game-Auto.git" given 2>/dev/null || mkdir -p given
          for id in $(grep -vE '^\s*(#|$)' given/drive.txt 2>/dev/null); do
            f="drive-$RANDOM.bin"
            curl -sSL -m 900 -o "$f" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            pkg=$(python3 -I - "$f" $PACKAGES <<'PY'
          import json, re, sys, zipfile
          path, pkgs = sys.argv[1], sys.argv[2:]
          try:
              z = zipfile.ZipFile(path)
          except Exception:
              sys.exit()
          names = z.namelist()
          if "manifest.json" in names:                       # .xapk
              try:
                  print(json.loads(z.read("manifest.json")).get("package_name", "")); sys.exit()
              except Exception:
                  pass
          inner = [n for n in names if n.endswith(".apk")]
          blobs = [z.read("AndroidManifest.xml")] if "AndroidManifest.xml" in names else []
          for n in inner[:3]:
              try:
                  blobs.append(zipfile.ZipFile(z.open(n)).read("AndroidManifest.xml"))
              except Exception:
                  pass
          text = " ".join(b.decode("utf-16-le", "ignore") for b in blobs)
          for p in pkgs:
              if re.search(re.escape(p) + r"(?![A-Za-z0-9_.])", text) or p in text:
                  print(p); sys.exit()
          PY
          )
            parts=$(unzip -l "$f" 2>/dev/null | grep -oE '[^ /]+\.apk$' | tr '\n' ' ')
            echo "Google Drive file: $(stat -c %s "$f") bytes, app: ${pkg:-unknown}, parts: ${parts:-none (not a zip)}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$pkg" ]; then if [ "$(echo $parts | wc -w)" -gt 0 ]; then mv "$f" "given/$pkg.apks"; else mv "$f" "given/$pkg.apk"; fi; fi
          done
          for p in $PACKAGES; do
            mkdir -p "apks/$p/given" "apks/$p/pure"; log="out/$p/download.txt"; : > "$log"
            # 1. given by hand in the private repo: branch explore-apks (<package>.apk/.apks/.xapk) or release explore-apks
            if [ ! -d given ]; then git clone -q --depth 1 --branch explore-apks "https://x-access-token:$GH_TOKEN@github.com/Bhautik-4B/Game-Auto.git" given 2>/dev/null || mkdir -p given; fi
            cp given/$p.* "apks/$p/given/" 2>/dev/null && echo "private branch explore-apks: $(ls given/$p.* | xargs -n1 basename | tr '\n' ' ')" >> "$log" || echo "private branch explore-apks: none" >> "$log"
            gh release download explore-apks --repo Bhautik-4B/Game-Auto --pattern "$p.*" --dir "apks/$p/given" >>"$log" 2>&1 && echo "private release explore-apks: ok" >> "$log" || echo "private release explore-apks: none" >> "$log"
            # 2. apkeep from APKPure (its API), also when a base was given: for the split parts a base
            #    from Google Play needs (the app's code for the CPU: libflutter.so, libapp.so). Android
            #    installs the parts together only when all are signed with the same key as the given
            #    base, so a part APKPure changed is refused (the install step says so).
            if [ "$APKPURE" = "true" ] && [ -x ./apkeep ]; then
              echo "APKPure app API answer (first 800 bytes):" >> "$log"
              curl -sS -m 60 -H "x-cv: 3172501" -H "x-sv: 29" -H "x-abis: arm64-v8a,armeabi-v7a,armeabi" -H "x-gp: 1" \
                "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=$p" -w '\n  (http %{http_code}, %{size_download} bytes)' 2>&1 | tr -cd '[:print:]\n' | head -c 800 >> "$log"; echo >> "$log"
              echo "apkeep: versions APKPure lists:" >> "$log"
              timeout 120 ./apkeep -l -d apk-pure -a "$p" </dev/null >>"$log" 2>&1; echo "  (list exit $?)" >> "$log"
              RUST_LOG=debug timeout 300 ./apkeep -d apk-pure -o 'acknowledge_dangers=true' -a "$p" "apks/$p/pure" </dev/null >>"$log" 2>&1
              echo "apkeep (APKPure) exit $?: $(ls -l apks/$p/pure | tail -n +2 | awk '{print $NF, $5}' | tr '\n' ' ')" >> "$log"
            fi
            # 3. APKPure download links
            for kind in XAPK APK; do
              got "$p" && break
              [ "$APKPURE" = "true" ] || break
              code=$(curl -sL -A "$UA" -o "apks/$p/pure/$p.$(echo $kind | tr A-Z a-z)" -w '%{http_code} %{content_type} %{size_download}' "https://d.apkpure.com/b/$kind/$p?version=latest")
              echo "apkpure $kind: $code" >> "$log"
              got "$p" || rm -f "apks/$p/pure/$p.$(echo $kind | tr A-Z a-z)"
            done
            # 4. APKCombo: its page names a download link
            if ! got "$p" && [ "$APKPURE" = "true" ]; then
              page=$(curl -sL -A "$UA" "https://apkcombo.com/a/$p/download/apk" || true)
              link=$(echo "$page" | grep -oE 'https://[^"]*(apkcombo|pureapk)[^"]*\.(apk|xapk)[^"]*' | head -1 | sed 's/&amp;/\&/g')
              echo "apkcombo page: ${#page} bytes, link: ${link:-none}" >> "$log"
              if [ -n "$link" ]; then f="apks/$p/pure/$p.$(echo "$link" | grep -oE 'xapk|apk' | head -1)"; curl -sL -A "$UA" -o "$f" "$link"; got "$p" || rm -f "$f"; fi
            fi
            echo "$p: given: $(ls apks/$p/given 2>/dev/null | tr '\n' ' ') | APKPure: $(ls apks/$p/pure 2>/dev/null | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY" "$log"
          done

      - name: Start Android (Redroid, arm64)
        run: |
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker run -d --name phone --privileged --memory=6g -p 5555:5555 "redroid/redroid:$ANDROID.0.0-latest" \
            androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420 >/dev/null
          for i in $(seq 1 84); do adb connect localhost:5555 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { echo "::error::Android did not boot"; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') ready" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install and explore every app (explore/explore.sh)
        run: |
          for p in $PACKAGES; do
            d="apks/$p"; work="$RUNNER_TEMP/x-$p"; mkdir -p "$work/given" "$work/pure"
            for src in given pure; do
              for f in "$d/$src"/*; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.xapk|*.apks|*.zip) unzip -q -o "$f" -d "$work/$src" ;;
                  *.apk) cp "$f" "$work/$src/" ;;
                esac
              done
            done
            # The parts: the given base (from Google Play) when there is one, else APKPure's; the split
            # parts (config.* / split_config.*) from either, without other CPUs' and other screen
            # densities' parts. All must be signed with one key, or Android refuses them.
            isbase() { case "$(basename "$1")" in config.*|split_config.*|split_*) return 1;; *) return 0;; esac; }
            base=""
            for f in "$work"/given/*.apk "$work"/pure/*.apk; do [ -f "$f" ] && isbase "$f" && { base=$f; break; }; done
            splits=$(for f in "$work"/given/*.apk "$work"/pure/*.apk; do [ -f "$f" ] && ! isbase "$f" && echo "$f"; done \
              | grep -vE 'config\.(armeabi|armeabi_v7a|x86|x86_64|mips)\.apk$' | grep -vE 'config\.(ldpi|mdpi|hdpi|xhdpi|xxxhdpi|tvdpi)\.apk$' \
              | awk -F/ '!seen[$NF]++' || true)
            echo "$p parts: base ${base:+$(basename "$(dirname "$base")")/$(basename "$base")}, splits: $(for f in $splits; do printf '%s/%s ' "$(basename "$(dirname "$f")")" "$(basename "$f")"; done)" | tee -a "out/$p/notes.txt"
            apks=$(for f in $base $splits; do echo "$f"; done)
            if [ -z "$apks" ]; then echo "$p: not downloaded (see download.txt)" | tee -a "$GITHUB_STEP_SUMMARY" "out/$p/notes.txt"; continue; fi
            if [ "$(echo "$apks" | wc -l)" = 1 ]; then r=$(adb install -r -g $apks 2>&1); else r=$(adb install-multiple -r -g $apks 2>&1); fi
            echo "$p install ($(echo $apks | wc -w) file(s): $(for a in $apks; do basename $a; done | tr '\n' ' ')): $(echo "$r" | tail -2 | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY" "out/$p/notes.txt"
            if [ -d "$work/Android/obb" ]; then adb push "$work/Android/obb/." /sdcard/Android/obb/ >/dev/null 2>&1; fi
            adb shell pm list packages | grep -q "package:$p$" || continue
            timeout $(( MINUTES * 60 + 600 )) bash explore/explore.sh "$p" "out/$p" "$MINUTES" || echo "explore stopped after its time limit" >> "out/$p/notes.txt"
            tail -1 "out/$p/notes.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            adb shell am force-stop "$p"
          done

      # Results only in the private repo (this repo is public). Needs PRIVATE_REPO with
      # Contents: Read and write on Bhautik-4B/Game-Auto.
      - name: Store results in the private repo (Bhautik-4B/Game-Auto, branch app-explore-results)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/Bhautik-4B/Game-Auto.git"
          if ! git clone -q --depth 1 --branch app-explore-results "$url" priv 2>/dev/null; then
            git init -q priv; git -C priv checkout -q -b app-explore-results; git -C priv remote add origin "$url"
          fi
          ist=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          dest="runs/$(TZ=Asia/Kolkata date '+%Y-%m-%d_%I-%M-%p')-run$GITHUB_RUN_NUMBER"
          mkdir -p "priv/$dest"; cp -r out/. "priv/$dest/"
          {
            echo "# App explore, run #$GITHUB_RUN_NUMBER"; echo; echo "$ist"
            for p in $PACKAGES; do
              echo; echo "# $p"; echo; echo '```'; cat "out/$p/play.txt" 2>/dev/null || true; echo; cat "out/$p/notes.txt" 2>/dev/null || true; echo '```'
              for f in $(cd "out/$p" 2>/dev/null && ls *.png 2>/dev/null); do echo; echo "## ${f%.png}"; echo; echo "<img src=\"$p/$f\" width=\"300\">"; done
            done
          } > "priv/$dest/README.md"
          cd priv
          git config user.name "Bhautik-4B"; git config user.email "4bornbhautik@gmail.com"
          git add runs; git commit -q -m "App explore run #$GITHUB_RUN_NUMBER, $ist"
          git push -q origin HEAD:app-explore-results && echo "Results stored: Bhautik-4B/Game-Auto, branch app-explore-results, $dest" | tee -a "$GITHUB_STEP_SUMMARY"
