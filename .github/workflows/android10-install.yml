name: Android 10 - install APKs and screenshot

# One job: starts real ARM Android 10 (Redroid container on GitHub's ARM runner), installs
# 4bTech Space, the game (base.apk) and 4B-Rummy-Home, opens each one and takes screenshots.
# Then gives 4bTech Game its permissions and signs it in (scripts/bot-setup.sh), and finishes its
# Setup: game Rummy Home, cloner 4bTech Space, Start never pressed (scripts/bot-configure.sh).
# Screenshots, the install log and the package list are uploaded as the artifact "screenshots"
# and committed to this branch under screenshots/ with a page (screenshots/README.md) showing them.
#
# Secret PRIVATE_REPO (or GAME_AUTO_TOKEN): a token that can read the releases of the private repo
# Bhautik-4B/Game-Auto (fine-grained, Contents: Read).
# Secrets FOUR_BTECH_GAME_EMAIL / FOUR_BTECH_GAME_PASSWORD: the 4bTech Game account (registered on
# the phone first: the app keeps accounts on the phone only); optional FOUR_BTECH_GAME_NAME / _MOBILE.
#
# Same network: the job runs 2 or 3 Redroid containers (input "devices", default 2) on one Docker
# network "wifi" (172.30.0.0/24). They share a subnet like phones on one Wi-Fi, so the app's local
# discovery (same Wi-Fi, same pool code) can find the other phones. Phone N: container androidN,
# IP 172.30.0.1N, adb localhost:600N, results in out/phoneN/.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: Number of phones on the same Wi-Fi (Docker network)
        type: choice
        options: ["2", "3"]
        default: "2"
  push:
    paths:
      - .github/workflows/android10-install.yml
      - scripts/**

permissions:
  contents: write

env:
  SPACE_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/4bTech-Space.apk
  GAME_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/base.apk
  RUMMY_URL: https://github.com/Bhautik-4B/Action-Auto/releases/download/qa-v2.1.9-qa/4B-Rummy-Home-2.1.9-qa.apk
  DEVICES: ${{ inputs.devices || '2' }}

jobs:
  android10:
    name: Android 10 (ARM) - install and screenshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the APKs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          mkdir -p apk out
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret PRIVATE_REPO is missing (needed for the private repo Bhautik-4B/Game-Auto)"; exit 1; }
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern 4bTech-Space.apk --dir apk
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern base.apk --dir apk
          curl -fsSL -o apk/4B-Rummy-Home.apk "$RUMMY_URL"
          ls -l apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start Android 10 phones on the same Wi-Fi (Redroid, arm64, one Docker network)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo apt-get install -y -qq tesseract-ocr python3-pil >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q redroid/redroid:10.0.0-latest >/dev/null
          docker network create --subnet 172.30.0.0/24 --gateway 172.30.0.1 wifi >/dev/null
          for n in $(seq 1 "$DEVICES"); do
            docker run -d --name "android$n" --network wifi --ip "172.30.0.1$n" --privileged --memory=4g --cpus=4 \
              -p "600$n:5555" redroid/redroid:10.0.0-latest \
              androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          done
          for n in $(seq 1 "$DEVICES"); do
            export ANDROID_SERIAL="localhost:600$n"; mkdir -p "out/phone$n"
            for i in $(seq 1 84); do adb connect "$ANDROID_SERIAL" >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
              docker logs "android$n" 2>&1 | tail -100 > "out/phone$n/boot_failure.txt"; echo "::error::Phone $n did not boot"; exit 1
            fi
            echo "Phone $n: Android $(adb shell getprop ro.build.version.release | tr -d '\r'), $(adb shell getprop ro.product.cpu.abi | tr -d '\r'), Wi-Fi IP 172.30.0.1$n" | tee -a "$GITHUB_STEP_SUMMARY"
            adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          done
          # Same Wi-Fi check: every phone reaches every other phone on the shared subnet
          for n in $(seq 1 "$DEVICES"); do for m in $(seq 1 "$DEVICES"); do
            [ "$n" = "$m" ] && continue
            if adb -s "localhost:600$n" shell ping -c 1 -W 3 "172.30.0.1$m" >/dev/null 2>&1; then r="reachable"; else r="NOT reachable"; fi
            echo "Phone $n -> phone $m (172.30.0.1$m): $r" | tee -a out/network.txt "$GITHUB_STEP_SUMMARY"
          done; done
          sleep 5
          for n in $(seq 1 "$DEVICES"); do adb -s "localhost:600$n" exec-out screencap -p > "out/phone$n/0-home.png"; done

      - name: Full cycle - install, sign in, Setup (scripts/full-cycle.sh)
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          # one phone after another (all at once is too slow on the runner's 4 CPUs: taps get missed),
          # each with its own adb serial and results folder; all phones stay on the same network
          for n in $(seq 1 "$DEVICES"); do
            r=0; ANDROID_SERIAL="localhost:600$n" bash scripts/full-cycle.sh apk "out/phone$n" || r=$?
            echo "$r" > "out/phone$n/rc"
          done
          RC=0
          for n in $(seq 1 "$DEVICES"); do
            r=$(cat "out/phone$n/rc" 2>/dev/null || echo 1); [ "$r" = 0 ] || RC=$r
            { echo "### Phone $n (rc $r)"; echo '```'; cat "out/phone$n/notes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "RC=$RC" >> "$GITHUB_ENV"

      - name: Pool - every phone selects Pool, phone 1 shows the code, the others enter it (scripts/pool-join.sh)
        run: |
          serials=""; for n in $(seq 1 "$DEVICES"); do serials="$serials localhost:600$n"; done
          r=0; bash scripts/pool-join.sh out/pool $serials || r=$?
          { echo "### Pool (rc $r)"; echo '```'; cat out/pool/notes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$r" = 0 ] || echo "RC=$r" >> "$GITHUB_ENV"

      - name: Remove credentials from the results
        if: always()
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          python3 -I - out <<'PY'
          import os, pathlib, sys
          secrets = [s for s in (os.environ.get("FOUR_BTECH_GAME_" + k) for k in ("EMAIL", "PASSWORD", "MOBILE")) if s]
          for f in pathlib.Path(sys.argv[1]).rglob("*"):
              if f.is_file() and f.suffix in (".txt", ".xml", ".md"):
                  t = f.read_text(errors="replace")
                  for s in secrets:
                      t = t.replace(s, "***")
                  f.write_text(t)
          PY
          rm -f out/ui.xml out/phone*/ui.xml out/pool/ui.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out
          retention-days: 7

      - name: Publish screenshots page on this branch
        if: always()
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" site
          rm -rf site/screenshots; mkdir -p site/screenshots; cp -r out/. site/screenshots/
          {
            echo "# Android 10 - install and screenshot"
            echo
            echo "Run [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'; cat out/network.txt 2>/dev/null; echo '```'
            for d in $(cd out && ls -d phone* pool 2>/dev/null); do
              echo; echo "# $d"; echo; echo '```'; cat "out/$d/notes.txt" 2>/dev/null; echo '```'
              for f in $(cd "out/$d" && ls *.png 2>/dev/null); do echo; echo "## $d - ${f%.png}"; echo; echo "<img src=\"$d/$f\" width=\"300\">"; done
            done
          } > site/screenshots/README.md
          cd site
          git config user.name "Bhautik-4B"; git config user.email "4bornbhautik@gmail.com"
          git add screenshots
          git commit -q -m "Screenshots from run #$GITHUB_RUN_NUMBER (Android 10)" && git push -q origin "HEAD:$GITHUB_REF_NAME" || echo "nothing to publish"

      - name: Fail if a step failed
        if: env.RC != '0'
        run: exit 1
