name: Android 10 - install APKs and screenshot

# One job: starts real ARM Android 10 (Redroid container on GitHub's ARM runner), installs
# 4bTech Space, the game (base.apk) and 4B-Rummy-Home, opens each one and takes screenshots.
# Then gives 4bTech Game its permissions and signs it in (scripts/bot-setup.sh), and finishes its
# Setup: game Rummy Home, cloner 4bTech Space, Start never pressed (scripts/bot-configure.sh).
# Results (screenshots, notes, pool code) are stored only in the private repo Bhautik-4B/Game-Auto,
# branch workflow-results, folder runs/<date>-run<N>/ with a README.md page; the public run log and
# summary show only pass/fail.
#
# Secret PRIVATE_REPO (or GAME_AUTO_TOKEN): a token that can read the releases of the private repo
# Bhautik-4B/Game-Auto (fine-grained, Contents: Read).
# Secrets FOUR_BTECH_GAME_EMAIL / FOUR_BTECH_GAME_PASSWORD: the 4bTech Game account (registered on
# the phone first: the app keeps accounts on the phone only); optional FOUR_BTECH_GAME_NAME / _MOBILE.
#
# Same network: the job runs 2 or 3 Redroid containers (input "devices", default 2) on one Docker
# network "wifi" (172.30.0.0/24). They share a subnet like phones on one Wi-Fi, so the app's local
# discovery (same Wi-Fi, same pool code) can find the other phones. Phone N: container androidN,
# IP 172.30.0.1N, adb localhost:600N, results in out/phoneN/.

on:
  workflow_dispatch:
    inputs:
      devices:
        description: Number of phones on the same Wi-Fi (Docker network)
        type: choice
        options: ["2", "3"]
        default: "2"
      mode:
        description: "restore = start from the saved phones (skips install, sign-in, Setup); fresh = set up from scratch"
        type: choice
        options: ["restore", "fresh"]
        default: "restore"
      save:
        description: Save the phones at the end (for restore next time)
        type: boolean
        default: true
  push:
    paths:
      - .github/workflows/android10-install.yml
      - scripts/**

permissions:
  contents: read

env:
  SPACE_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/4bTech-Space.apk
  GAME_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/base.apk
  RUMMY_URL: https://github.com/Bhautik-4B/Action-Auto/releases/download/qa-v2.1.9-qa/4B-Rummy-Home-2.1.9-qa.apk
  DEVICES: ${{ inputs.devices || '2' }}
  # Runs started by a push set up from scratch and never save (only Run workflow saves).
  MODE: ${{ inputs.mode || 'fresh' }}
  SAVE: ${{ github.event_name == 'workflow_dispatch' && inputs.save && 'yes' || 'no' }}
  RC: "0"

jobs:
  android10:
    name: Android 10 (ARM) - install and screenshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download the APKs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          mkdir -p apk out
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret PRIVATE_REPO is missing (needed for the private repo Bhautik-4B/Game-Auto)"; exit 1; }
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern 4bTech-Space.apk --dir apk
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern base.apk --dir apk
          curl -fsSL -o apk/4B-Rummy-Home.apk "$RUMMY_URL"
          ls -l apk | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved phones: the private release "phones" of Bhautik-4B/Game-Auto, one archive of /data per
      # phone (phone<N>.tar.zst, split in parts under 2 GB). Restored only when all phones are there.
      - name: Restore the saved phones (mode restore)
        if: env.MODE == 'restore'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          mkdir -p saved
          ok=1
          for n in $(seq 1 "$DEVICES"); do
            gh release download phones --repo Bhautik-4B/Game-Auto --pattern "phone$n.tar.zst.*" --dir saved >/dev/null 2>&1 || ok=0
            ls saved/phone$n.tar.zst.* >/dev/null 2>&1 || ok=0
          done
          if [ "$ok" = 1 ]; then
            sudo apt-get install -y -qq zstd >/dev/null
            for n in $(seq 1 "$DEVICES"); do
              sudo mkdir -p "$HOME/phone$n-data"
              cat saved/phone$n.tar.zst.* | sudo tar --numeric-owner --xattrs -I zstd -xf - -C "$HOME/phone$n-data"
            done
            rm -rf saved
            echo "RESTORED=1" >> "$GITHUB_ENV"
            echo "Restored $DEVICES saved phones: install, sign-in and Setup skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            rm -rf saved
            echo "No saved phones for $DEVICES phones yet: setting up from scratch" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start Android 10 phones on the same Wi-Fi (Redroid, arm64, one Docker network)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo apt-get install -y -qq tesseract-ocr python3-pil >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q redroid/redroid:10.0.0-latest >/dev/null
          docker network create --subnet 172.30.0.0/24 --gateway 172.30.0.1 wifi >/dev/null
          for n in $(seq 1 "$DEVICES"); do
            sudo mkdir -p "$HOME/phone$n-data"                # the phone's /data: saved and restored
            docker run -d --name "android$n" --network wifi --ip "172.30.0.1$n" --privileged --memory=4g --cpus=4 \
              -v "$HOME/phone$n-data:/data" -p "600$n:5555" redroid/redroid:10.0.0-latest \
              androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          done
          for n in $(seq 1 "$DEVICES"); do
            export ANDROID_SERIAL="localhost:600$n"; mkdir -p "out/phone$n"
            for i in $(seq 1 84); do adb connect "$ANDROID_SERIAL" >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
              docker logs "android$n" 2>&1 | tail -100 > "out/phone$n/boot_failure.txt"; echo "::error::Phone $n did not boot"; exit 1
            fi
            echo "Phone $n: Android $(adb shell getprop ro.build.version.release | tr -d '\r'), $(adb shell getprop ro.product.cpu.abi | tr -d '\r'), Wi-Fi IP 172.30.0.1$n" | tee -a "$GITHUB_STEP_SUMMARY"
            adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          done
          # Same Wi-Fi check: every phone reaches every other phone on the shared subnet
          for n in $(seq 1 "$DEVICES"); do for m in $(seq 1 "$DEVICES"); do
            [ "$n" = "$m" ] && continue
            if adb -s "localhost:600$n" shell ping -c 1 -W 3 "172.30.0.1$m" >/dev/null 2>&1; then r="reachable"; else r="NOT reachable"; fi
            echo "Phone $n -> phone $m (172.30.0.1$m): $r" | tee -a out/network.txt "$GITHUB_STEP_SUMMARY"
          done; done
          sleep 5
          for n in $(seq 1 "$DEVICES"); do adb -s "localhost:600$n" exec-out screencap -p > "out/phone$n/0-home.png"; done

      - name: Full cycle - install, sign in, Setup (scripts/full-cycle.sh)
        if: env.RESTORED != '1'
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          # one phone after another (all at once is too slow on the runner's 4 CPUs: taps get missed),
          # each with its own adb serial and results folder; all phones stay on the same network
          for n in $(seq 1 "$DEVICES"); do
            r=0; ANDROID_SERIAL="localhost:600$n" bash scripts/full-cycle.sh apk "out/phone$n" >/dev/null 2>&1 || r=$?
            echo "$r" > "out/phone$n/rc"
          done
          RC=0
          for n in $(seq 1 "$DEVICES"); do
            r=$(cat "out/phone$n/rc" 2>/dev/null || echo 1); [ "$r" = 0 ] || RC=$r
            echo "Phone $n: rc $r, $(grep -cE '^PASS' "out/phone$n/notes.txt" 2>/dev/null) PASS, $(grep -cE '^FAIL' "out/phone$n/notes.txt" 2>/dev/null) FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "RC=$RC" >> "$GITHUB_ENV"

      - name: Pool - every phone selects Pool, phone 1 shows the code, the others enter it (scripts/pool-join.sh)
        run: |
          serials=""; for n in $(seq 1 "$DEVICES"); do serials="$serials localhost:600$n"; done
          r=0; bash scripts/pool-join.sh out/pool $serials >/dev/null 2>&1 || r=$?
          echo "Pool: rc $r" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$r" = 0 ] || echo "RC=$r" >> "$GITHUB_ENV"
          echo "POOL_RC=$r" >> "$GITHUB_ENV"

      - name: Start - press Start on every phone once all are in one pool (scripts/press-start.sh)
        if: env.POOL_RC == '0'
        run: |
          serials=""; for n in $(seq 1 "$DEVICES"); do serials="$serials localhost:600$n"; done
          r=0; bash scripts/press-start.sh out/start $serials >/dev/null 2>&1 || r=$?
          [ "$r" = 0 ] || echo "RC=$r" >> "$GITHUB_ENV"
          echo "Start: rc $r" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the phones for next time (private release "phones" of Bhautik-4B/Game-Auto)
        if: env.SAVE == 'yes' && env.POOL_RC == '0'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          sudo apt-get install -y -qq zstd >/dev/null
          for n in $(seq 1 "$DEVICES"); do docker stop -t 30 "android$n" >/dev/null; done   # shut down cleanly
          mkdir -p saved
          for n in $(seq 1 "$DEVICES"); do
            sudo tar --numeric-owner --xattrs -I 'zstd -T0 -6' -cf - -C "$HOME/phone$n-data" \
              --exclude=./dalvik-cache --exclude=./cache --exclude=./system/dropbox --exclude=./tombstones --exclude=./anr . \
              | split -b 1900M -d -a 2 - "saved/phone$n.tar.zst."
            echo "Phone $n saved: $(du -ch saved/phone$n.tar.zst.* | tail -1 | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          ist=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          gh release view phones --repo Bhautik-4B/Game-Auto >/dev/null 2>&1 || \
            gh release create phones --repo Bhautik-4B/Game-Auto --title "Saved phones" \
              --notes "Saved Android phones (/data) for the workflow's restore mode. Private." >/dev/null
          # old parts out first (a phone may now have fewer parts), then the new ones
          for a in $(gh release view phones --repo Bhautik-4B/Game-Auto --json assets -q '.assets[].name' | grep -E "^phone[1-$DEVICES]\.tar\.zst\."); do
            gh release delete-asset phones "$a" --repo Bhautik-4B/Game-Auto -y >/dev/null
          done
          gh release upload phones saved/* --repo Bhautik-4B/Game-Auto --clobber
          gh release edit phones --repo Bhautik-4B/Game-Auto \
            --notes "Saved Android phones (/data) for the workflow's restore mode. Private. Last saved: run #$GITHUB_RUN_NUMBER, $DEVICES phones, $ist." >/dev/null
          rm -rf saved
          echo "Phones saved (run #$GITHUB_RUN_NUMBER, $ist)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials from the results
        if: always()
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          python3 -I - out <<'PY'
          import os, pathlib, sys
          secrets = [s for s in (os.environ.get("FOUR_BTECH_GAME_" + k) for k in ("EMAIL", "PASSWORD", "MOBILE")) if s]
          for f in pathlib.Path(sys.argv[1]).rglob("*"):
              if f.is_file() and f.suffix in (".txt", ".xml", ".md"):
                  t = f.read_text(errors="replace")
                  for s in secrets:
                      t = t.replace(s, "***")
                  f.write_text(t)
          PY
          rm -f out/ui.xml out/phone*/ui.xml out/pool/ui.xml out/start/ui.xml

      # Results (screenshots, notes, pool code) are stored only in the private repo
      # Bhautik-4B/Game-Auto, branch workflow-results, folder runs/<date>-run<N>/ (this repo is public).
      # Needs the PRIVATE_REPO token to have Contents: Read and write on Bhautik-4B/Game-Auto.
      - name: Store results in the private repo (Bhautik-4B/Game-Auto, branch workflow-results)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/Bhautik-4B/Game-Auto.git"
          if ! git clone -q --depth 1 --branch workflow-results "$url" priv 2>/dev/null; then
            git init -q priv; git -C priv checkout -q -b workflow-results; git -C priv remote add origin "$url"
          fi
          ist=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          dest="runs/$(TZ=Asia/Kolkata date '+%Y-%m-%d_%I-%M-%p')-run$GITHUB_RUN_NUMBER"
          mkdir -p "priv/$dest"; cp -r out/. "priv/$dest/"
          {
            echo "# Run #$GITHUB_RUN_NUMBER - $DEVICES phones on one Wi-Fi"
            echo
            echo "$ist - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'; cat out/network.txt 2>/dev/null; echo '```'
            for d in $(cd out && ls -d phone* pool start 2>/dev/null); do
              echo; echo "# $d"; echo; echo '```'; cat "out/$d/notes.txt" 2>/dev/null; echo '```'
              for f in $(cd "out/$d" && ls *.png 2>/dev/null); do echo; echo "## $d - ${f%.png}"; echo; echo "<img src=\"$d/$f\" width=\"300\">"; done
            done
          } > "priv/$dest/README.md"
          cd priv
          git config user.name "Bhautik-4B"; git config user.email "4bornbhautik@gmail.com"
          git add runs
          git commit -q -m "Run #$GITHUB_RUN_NUMBER ($DEVICES phones), $ist"
          if git push -q origin HEAD:workflow-results 2>/dev/null; then
            echo "Results stored in Bhautik-4B/Game-Auto, branch workflow-results, $dest" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not store the results: the PRIVATE_REPO token needs Contents: Read and write on Bhautik-4B/Game-Auto"
            echo "RC=1" >> "$GITHUB_ENV"
          fi

      - name: Fail if a step failed
        if: env.RC != '0'
        run: exit 1
