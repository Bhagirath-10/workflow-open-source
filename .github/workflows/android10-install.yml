name: Android 10 - install APKs and screenshot

# One job: starts real ARM Android 10 (Redroid container on GitHub's ARM runner), installs
# 4bTech Space, the game (base.apk) and 4B-Rummy-Home, opens each one and takes screenshots.
# Then gives 4bTech Game its permissions and signs it in (scripts/bot-setup.sh).
# Screenshots, the install log and the package list are uploaded as the artifact "screenshots"
# and committed to this branch under screenshots/ with a page (screenshots/README.md) showing them.
#
# Secret PRIVATE_REPO (or GAME_AUTO_TOKEN): a token that can read the releases of the private repo
# Bhautik-4B/Game-Auto (fine-grained, Contents: Read).
# Secrets FOUR_BTECH_GAME_EMAIL / FOUR_BTECH_GAME_PASSWORD: the 4bTech Game account (registered on
# the phone first: the app keeps accounts on the phone only); optional FOUR_BTECH_GAME_NAME / _MOBILE.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android10-install.yml
      - scripts/**

permissions:
  contents: write

env:
  SPACE_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/4bTech-Space.apk
  GAME_URL: https://github.com/Bhautik-4B/Game-Auto/releases/download/APK/base.apk
  RUMMY_URL: https://github.com/Bhautik-4B/Action-Auto/releases/download/qa-v2.1.9-qa/4B-Rummy-Home-2.1.9-qa.apk
  ANDROID_SERIAL: localhost:6000

jobs:
  android10:
    name: Android 10 (ARM) - install and screenshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the APKs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO || secrets.GAME_AUTO_TOKEN }}
        run: |
          mkdir -p apk out
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret PRIVATE_REPO is missing (needed for the private repo Bhautik-4B/Game-Auto)"; exit 1; }
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern 4bTech-Space.apk --dir apk
          gh release download APK --repo Bhautik-4B/Game-Auto --pattern base.apk --dir apk
          curl -fsSL -o apk/4B-Rummy-Home.apk "$RUMMY_URL"
          ls -l apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start Android 10 (Redroid, arm64)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq adb "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || sudo apt-get install -y -qq adb >/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux 2>/dev/null || true
          docker pull -q redroid/redroid:10.0.0-latest >/dev/null
          docker run -d --name android --privileged --memory=4g --cpus=4 -p 6000:5555 redroid/redroid:10.0.0-latest \
            androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true androidboot.redroid_width=1080 androidboot.redroid_height=2280 androidboot.redroid_dpi=420
          for i in $(seq 1 84); do adb connect localhost:6000 >/dev/null 2>&1; [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
            docker logs android 2>&1 | tail -100 > out/boot_failure.txt; echo "::error::Android did not boot"; exit 1
          fi
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r'), $(adb shell getprop ro.product.cpu.abi | tr -d '\r')" | tee -a "$GITHUB_STEP_SUMMARY"
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          sleep 5; adb exec-out screencap -p > out/0-home.png

      - name: Install the 3 APKs and screenshot each
        run: |
          RC=0; n=0
          for f in 4bTech-Space.apk base.apk 4B-Rummy-Home.apk; do
            n=$((n + 1)); name=${f%.apk}
            before=$(adb shell pm list packages -3 | tr -d '\r' | sort)
            if adb install -r -g "apk/$f" > "out/install-$name.txt" 2>&1; then
              pkg=$(comm -13 <(echo "$before") <(adb shell pm list packages -3 | tr -d '\r' | sort) | head -1 | sed 's/^package://')
              echo "PASS install $f ($pkg)" | tee -a out/notes.txt
              if [ -n "$pkg" ]; then
                ver=$(adb shell dumpsys package "$pkg" | tr -d '\r' | grep -m1 versionName | sed 's/ *versionName=//')
                echo "  version $ver" | tee -a out/notes.txt
                # Proof of install: the app's own App info page in Settings.
                adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d "package:$pkg" >/dev/null 2>&1 || true
                sleep 4; adb exec-out screencap -p > "out/$n-$name-1-appinfo.png"
                adb shell input keyevent KEYCODE_HOME; sleep 1
                # Open it through its launcher activity and screenshot what is on screen.
                act=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$pkg" | tr -d '\r' | tail -1)
                adb logcat -c
                adb shell am start -W -n "$act" > "out/launch-$name.txt" 2>&1 || true
                sleep 25
                adb exec-out screencap -p > "out/$n-$name-2-open.png"
                top=$(adb shell dumpsys activity activities | tr -d '\r' | grep -m1 -E "mResumedActivity|topResumedActivity" | sed 's/^ *//')
                echo "  launch $act -> on screen: $top" | tee -a out/notes.txt
                adb logcat -d -b crash > "out/crash-$name.txt" 2>/dev/null || true
                [ -s "out/crash-$name.txt" ] && echo "  CRASH log: crash-$name.txt" | tee -a out/notes.txt
                adb shell am force-stop "$pkg"; adb shell input keyevent KEYCODE_HOME; sleep 2
              fi
            else
              RC=1; echo "FAIL install $f: $(tail -1 "out/install-$name.txt")" | tee -a out/notes.txt
            fi
          done
          adb exec-out screencap -p > out/9-final.png
          adb shell pm list packages -3 | tr -d '\r' > out/packages.txt
          { echo '```'; cat out/notes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "RC=$RC" >> "$GITHUB_ENV"

      - name: 4bTech Game - permissions and sign-in
        if: env.RC == '0'
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          bash scripts/bot-setup.sh out || echo "RC=1" >> "$GITHUB_ENV"
          { echo '```'; sed -n '/## 4bTech Game/,$p' out/notes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials from the results
        if: always()
        env:
          FOUR_BTECH_GAME_EMAIL: ${{ secrets.FOUR_BTECH_GAME_EMAIL }}
          FOUR_BTECH_GAME_PASSWORD: ${{ secrets.FOUR_BTECH_GAME_PASSWORD }}
          FOUR_BTECH_GAME_NAME: ${{ secrets.FOUR_BTECH_GAME_NAME }}
          FOUR_BTECH_GAME_MOBILE: ${{ secrets.FOUR_BTECH_GAME_MOBILE }}
        run: |
          python3 -I - out <<'PY'
          import os, pathlib, sys
          secrets = [s for s in (os.environ.get("FOUR_BTECH_GAME_" + k) for k in ("EMAIL", "PASSWORD", "MOBILE")) if s]
          for f in pathlib.Path(sys.argv[1]).rglob("*"):
              if f.is_file() and f.suffix in (".txt", ".xml", ".md"):
                  t = f.read_text(errors="replace")
                  for s in secrets:
                      t = t.replace(s, "***")
                  f.write_text(t)
          PY
          rm -f out/ui.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out
          retention-days: 7

      - name: Publish screenshots page on this branch
        if: always()
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" site
          rm -rf site/screenshots; mkdir -p site/screenshots; cp -r out/. site/screenshots/
          {
            echo "# Android 10 - install and screenshot"
            echo
            echo "Run [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'; cat out/notes.txt 2>/dev/null; echo '```'
            for f in $(cd out && ls *.png 2>/dev/null); do echo; echo "## ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; done
          } > site/screenshots/README.md
          cd site
          git config user.name "Bhautik-4B"; git config user.email "4bornbhautik@gmail.com"
          git add screenshots
          git commit -q -m "Screenshots from run #$GITHUB_RUN_NUMBER (Android 10)" && git push -q origin "HEAD:$GITHUB_REF_NAME" || echo "nothing to publish"

      - name: Fail if an install failed
        if: env.RC == '1'
        run: exit 1
